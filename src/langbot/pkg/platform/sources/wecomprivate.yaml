apiVersion: v1
kind: MessagePlatformAdapter
metadata:
  name: wecomprivate
  label:
    en_US: WeComPrivateDomain
    zh_Hans: 企微私域托管
    zh_Hant: 企微私域託管
  description:
    en_US: WeCom private-domain hosted mode
    zh_Hans: 企业微信私域好友托管接入
    zh_Hant: 企業微信私域好友託管接入
  icon: wecom.png
spec:
  categories:
    - china
  config:
    - name: entry_id
      label:
        en_US: Entry ID
        zh_Hans: 入口标识
        zh_Hant: 入口標識
      description:
        en_US: Stable private-domain entry identifier
        zh_Hans: 用于构造私域会话标识的稳定入口名
        zh_Hant: 用於構造私域會話標識的穩定入口名
      type: string
      required: true
      default: ""
    - name: workbench_url
      label:
        en_US: Console URL
        zh_Hans: 控制台地址
        zh_Hant: 控制台地址
      description:
        en_US: Hosted private-domain workbench URL
        zh_Hans: 用于托管私域会话的控制台页面地址
        zh_Hant: 用於託管私域會話的控制台頁面地址
      type: string
      required: true
      default: https://work.weixin.qq.com/
    - name: storage_state_dir
      label:
        en_US: Storage State Directory
        zh_Hans: 登录态存储目录
        zh_Hant: 登錄態存儲目錄
      description:
        en_US: Directory for browser storage state files
        zh_Hans: 用于保存浏览器登录态文件的目录
        zh_Hant: 用於保存瀏覽器登錄態文件的目錄
      type: string
      required: true
      default: ./data/wecomprivate
    - name: corpid
      label:
        en_US: Corp ID
        zh_Hans: 企业 ID
        zh_Hant: 企業 ID
      type: string
      required: false
      default: ""
    - name: contacts_secret
      label:
        en_US: Contact Secret
        zh_Hans: 客户联系 Secret
        zh_Hant: 客戶聯繫 Secret
      type: string
      required: false
      default: ""
    - name: poll_interval_seconds
      label:
        en_US: Poll Interval
        zh_Hans: 轮询间隔
        zh_Hant: 輪詢間隔
      type: integer
      required: false
      default: 2
    - name: headless
      label:
        en_US: Headless
        zh_Hans: 无头模式
        zh_Hant: 無頭模式
      type: boolean
      required: false
      default: true
    - name: browser_executable_path
      label:
        en_US: Browser Executable Path
        zh_Hans: 浏览器路径
        zh_Hant: 瀏覽器路徑
      type: string
      required: false
      default: ""
execution:
  python:
    path: ./wecomprivate.py
    attr: WecomPrivateAdapter
