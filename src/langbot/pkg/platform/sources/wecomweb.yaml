apiVersion: v1
kind: MessagePlatformAdapter
metadata:
  name: wecomweb
  label:
    en_US: WeComCustomerService
    zh_Hans: 企业微信客服
    zh_Hant: 企業微信客服
  description:
    en_US: WeCom customer service hosted mode
    zh_Hans: 企业微信对外客服托管接入
    zh_Hant: 企業微信對外客服託管接入
  icon: wecom.png
spec:
  categories:
    - china
  config:
    - name: account_label
      label:
        en_US: Entry Label
        zh_Hans: 入口标识
        zh_Hant: 入口標識
      description:
        en_US: Stable identifier used for service desk sessions
        zh_Hans: 用于构造客服台会话标识的稳定入口名
        zh_Hant: 用於構造客服台會話標識的穩定入口名
      type: string
      required: true
      default: "企微客服托管号"
    - name: workbench_url
      label:
        en_US: Console URL
        zh_Hans: 控制台地址
        zh_Hant: 控制台地址
      description:
        en_US: Console URL used for hosted customer service sessions
        zh_Hans: 用于托管客服会话的控制台页面地址
        zh_Hant: 用於託管客服會話的控制台頁面地址
      type: string
      required: true
      default: "https://work.weixin.qq.com/kf/"
    - name: storage_state_dir
      label:
        en_US: Session State Directory
        zh_Hans: 会话状态目录
        zh_Hant: 會話狀態目錄
      description:
        en_US: Directory used to persist hosted session state
        zh_Hans: 用于持久化托管会话状态的目录
        zh_Hant: 用於持久化託管會話狀態的目錄
      type: string
      required: true
      default: "./data/wecomweb"
    - name: poll_interval_seconds
      label:
        en_US: Poll Interval Seconds
        zh_Hans: 监听间隔（秒）
        zh_Hant: 監聽間隔（秒）
      description:
        en_US: Interval for polling WeCom web page messages
        zh_Hans: 轮询企微网页消息的间隔秒数
        zh_Hant: 輪詢企微網頁訊息的間隔秒數
      type: integer
      required: false
      default: 2
    - name: headless
      label:
        en_US: Background Run
        zh_Hans: 后台运行
        zh_Hant: 後台運行
      description:
        en_US: Run the hosted session without opening a visible browser window. Visible browser mode is recommended for login safety.
        zh_Hans: 以后台模式运行托管会话，不弹出可见浏览器窗口。为降低登录异常风险，建议关闭此项。
        zh_Hant: 以後台模式執行託管會話，不彈出可見瀏覽器視窗。為降低登入異常風險，建議關閉此項。
      type: boolean
      required: false
      default: false
    - name: browser_executable_path
      label:
        en_US: Browser Executable Path
        zh_Hans: 浏览器可执行文件路径
        zh_Hant: 瀏覽器可執行檔路徑
      description:
        en_US: Optional system Chrome or Chromium executable path. When left empty, the runtime will try to auto-detect a system browser first.
        zh_Hans: 可选，指定系统 Chrome 或 Chromium 可执行文件路径。留空时会优先自动探测系统浏览器。
        zh_Hant: 可選，指定系統 Chrome 或 Chromium 可執行檔路徑。留空時會優先自動偵測系統瀏覽器。
      type: string
      required: false
      default: ""
    - name: print_login_qr
      label:
        en_US: Login Verification Output
        zh_Hans: 登录校验输出
        zh_Hant: 登入校驗輸出
      description:
        en_US: Output verification code information to terminal when the hosted session expires
        zh_Hans: 会话失效时在终端输出登录校验信息，便于重新验证
        zh_Hant: 會話失效時在終端輸出登入校驗資訊，便於重新驗證
      type: boolean
      required: false
      default: true
execution:
  python:
    path: ./wecomweb.py
    attr: WecomWebAdapter
